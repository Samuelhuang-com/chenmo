# ⚠ 請把此檔移到 .github/workflows/deploy.yml 才會生效
# push 到 main 自動測試並部署到 Cloud Run。
# 需要在 GitHub repo 的 Settings > Secrets and variables > Actions 設定：
#   GCP_PROJECT_ID、GCP_WIF_PROVIDER、GCP_DEPLOY_SA、MASTER_EMAILS
# 設定方式見 docs/GCP部署指南.md 第 6 節（使用 Workload Identity Federation，不需金鑰檔）。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MASTER_EMAILS: ${{ secrets.MASTER_EMAILS }}
        run: bash deploy/deploy.sh
