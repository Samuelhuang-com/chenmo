{% extends "base.html" %}
{% block main %}
<section class="hero">
  <h1 class="hero-title">辰墨軒<small>一字問心</small></h1>
  <div class="hero-body">
    <div class="hero-char grid-paper" aria-hidden="true">問</div>
    <p>心中有事，不必長篇。寫下一句所問，再於格中親手寫一個字。</p>
    <p>老師看的不只是字，還有您落筆的先後、停頓與輕重。每一筆，都會照著您寫下的順序呈到老師案前。</p>
    <a class="btn btn-zhu" href="/ask">寫字問事</a>
  </div>
</section>

<section class="paper" style="max-width:640px">
  <h2>如何問字</h2>
  <ol class="flow">
    <li><b>一</b><span>用一百字以內，簡述想問的事。</span></li>
    <li><b>二</b><span>在米字格中，用手指或觸控筆寫下心中浮現的第一個字。</span></li>
    <li><b>三</b><span>送出後，老師會從字的五行、古字本義與字義為您解讀，完成時頁面會自動更新。</span></li>
  </ol>
</section>
{% endblock %}
